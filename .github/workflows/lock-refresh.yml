name: lock-refresh (temporary)
on:
  push:
    branches: [chore/react19-vite]
    paths: [.github/workflows/lock-refresh.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Upgrade React 19 + Vite 8 / plugin-react 6 together
        run: |
          node -e "
            const fs=require('fs');const p=require('./package.json');
            Object.assign(p.dependencies,{react:'^19.0.0','react-dom':'^19.0.0'});
            Object.assign(p.devDependencies,{'@types/react':'^19.0.0','@types/react-dom':'^19.0.0','@vitejs/plugin-react':'^6.0.0',vite:'^8.0.0'});
            fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install
          npm ls react react-dom vite @vitejs/plugin-react vitest --depth=0
      - name: Verify
        run: npm test && npm run build
      - name: Commit
        run: |
          git config user.name "amnindersingh12"
          git config user.email "amnindersingh58611@gmail.com"
          git add package.json package-lock.json
          git commit -m "chore: React 19, Vite 8, @vitejs/plugin-react 6" || echo "nothing to commit"
          git push
